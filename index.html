<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lavaKangJun — 앱</title>
<meta name="description" content="lavaKangJun이 만든 iOS 앱 모음.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #11111a;
    --muted: #6b6b78;
    --accent: #4550e5;
    --line: #e3e3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101014;
      --card: #1b1b21;
      --text: #f2f2f7;
      --muted: #9a9aa8;
      --accent: #7b84ff;
      --line: #2c2c35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101014;
    --card: #1b1b21;
    --text: #f2f2f7;
    --muted: #9a9aa8;
    --accent: #7b84ff;
    --line: #2c2c35;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Segoe UI", system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 72px; }

  header { padding: 80px 0 40px; }
  h1 { margin: 0 0 6px; font-size: 1.9rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }

  a.app {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    text-decoration: none; color: inherit;
    transition: border-color .15s, transform .15s;
  }
  a.app:hover { border-color: var(--accent); transform: translateY(-1px); }

  .icon {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    display: grid; place-items: center;
    background: var(--accent); color: #fff;
    border-radius: 14px;
    font-size: 27px; font-weight: 700;
  }
  .meta { flex: 1 1 auto; min-width: 0; }
  .meta strong { display: block; font-size: 1.05rem; letter-spacing: -0.01em; }
  .meta span { color: var(--muted); font-size: 0.92rem; }
  .chev { flex: 0 0 auto; color: var(--muted); font-size: 1.2rem; }

  footer {
    margin-top: 40px; padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 0.88rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>lavaKangJun</h1>
    <p>만든 앱들입니다.</p>
  </header>

  <a class="app" href="./mzmz/">
    <div class="icon">M</div>
    <div class="meta">
      <strong>MZMZ</strong>
      <span>관심 지역의 미세먼지와 초미세먼지를 확인하는 앱</span>
    </div>
    <div class="chev">›</div>
  </a>

  <a class="app" href="./pico/">
    <div class="icon">C</div>
    <div class="meta">
      <strong>PICO</strong>
      <span>피아노 코드를 찾아보고 소리로 확인하는 앱</span>
    </div>
    <div class="chev">›</div>
  </a>

  <!-- 앱이 늘면 위 블록을 복사해 href와 아이콘, 이름, 설명만 바꾼다.
       페이지는 ./새앱/index.html 에 두면 lavakangjun.github.io/새앱 으로 열린다.
       app-ads.txt는 루트에 그대로 두면 모든 앱이 함께 쓴다. -->

  <footer>
    <p>© <span id="year">2026</span> lavaKangJun</p>
  </footer>

</div>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
